<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文章 · 南京外国语学校 G202301</title>
<meta name="description" content="南京外国语学校 G202301 班同学原创随笔与佳作。">
<style>
:root{
  --navy:#0f2547; --navy-2:#1b3a63;
  --gold:#c9a227; --gold-light:#e8c96a;
  --bg:#f4f6fb; --card:#ffffff;
  --text:#1f2937; --muted:#6b7280; --line:#e5e9f2;
  --radius:16px;
  --shadow:0 10px 30px rgba(15,37,71,.08);
  --shadow-hover:0 18px 40px rgba(15,37,71,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
ul,ol{list-style:none}
.wrap{width:100%;max-width:900px;margin:0 auto;padding:0 20px;position:relative;z-index:1}

/* 页面头部 */
.page-hero{
  position:relative;overflow:hidden;
  padding:56px 0 52px;color:#fff;
  background:
    radial-gradient(760px 340px at 10% 0%, rgba(201,162,39,.20), transparent 62%),
    radial-gradient(680px 340px at 92% 20%, rgba(88,140,220,.26), transparent 62%),
    linear-gradient(160deg,#0f2547 0%,#1b3a63 60%,#14304f 100%);
}
.page-hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.08) 1px, transparent 1px);
  background-size:24px 24px;opacity:.4;
}
.page-hero h1{font-size:clamp(28px,4.4vw,40px);letter-spacing:1px;margin-bottom:12px}
.page-hero .sub{color:#c3d2e6;font-size:15px;max-width:640px}
.crumb{font-size:13px;color:#9fb3d1;margin-bottom:14px;letter-spacing:1px}
.crumb a:hover{color:var(--gold-light)}
.crumb span{margin:0 7px;opacity:.6}

.section{padding:40px 0 72px}
.list-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.list-head h2{font-size:17px;letter-spacing:.5px;color:var(--navy);display:flex;align-items:center;gap:9px}
.list-head h2::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(201,162,39,.18)}
.list-head .count{font-size:13.5px;color:var(--muted)}
.list-head .count b{color:var(--navy)}

/* ============ 文章条目 ============ */
.art-list{display:flex;flex-direction:column;gap:18px}

.art-item{
  position:relative;
  display:block;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:30px 34px 26px;
  overflow:hidden;
  transition:transform .28s ease, box-shadow .28s ease, border-color .28s ease;
  animation:rise .45s ease both;
}
.art-item:hover{
  transform:translateY(-4px);
  box-shadow:var(--shadow-hover);
  border-color:rgba(201,162,39,.55);
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* 左侧金色竖条 */
.art-item::before{
  content:"";
  position:absolute;left:0;top:26px;bottom:26px;
  width:4px;border-radius:0 4px 4px 0;
  background:linear-gradient(180deg,var(--gold-light),var(--gold));
  transition:top .28s ease, bottom .28s ease;
}
.art-item:hover::before{top:20px;bottom:20px}

/* 顶部：体裁标签 */
.art-genre{
  display:inline-block;
  font-size:11.5px;font-weight:700;letter-spacing:1.5px;
  color:#a8791a;
  background:#fdf1e0;
  padding:3px 11px;border-radius:6px;
  margin-bottom:14px;
}
.art-genre.dim{
  color:#5b6b7f;background:#eef1f5;
}

/* 标题（主角） */
.art-title{
  font-size:clamp(20px,3vw,24px);
  font-weight:800;
  letter-spacing:1px;
  line-height:1.5;
  color:var(--navy);
  margin-bottom:16px;
  transition:color .24s ease;
}
.art-item:hover .art-title{color:#a8791a}

/* 作者 · 日期 */
.art-meta{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding-top:16px;
  border-top:1px dashed var(--line);
  font-size:13.5px;
  color:var(--muted);
}
.art-meta .author{
  display:inline-flex;align-items:center;gap:6px;
  color:var(--navy);font-weight:700;
}
.art-meta .author .avatar{
  width:18px;height:18px;border-radius:50%;
  display:inline-grid;place-items:center;
  background:linear-gradient(135deg,var(--gold-light),var(--gold));
  color:var(--navy);
  flex:0 0 auto;
}
.art-meta .author .avatar svg{
  width:10px;height:10px;display:block;
  stroke:currentColor;fill:none;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
}
.art-meta .dot{
  width:3px;height:3px;border-radius:50%;background:#c3cbd8;
}
.art-meta .date{
  display:inline-flex;align-items:center;gap:6px;
  color:#6b7280;
  letter-spacing:.5px;
}

/* 右下角「阅读全文」 */
.art-read{
  position:absolute;right:34px;bottom:26px;
  display:inline-flex;align-items:center;gap:6px;
  font-size:13.5px;font-weight:700;letter-spacing:.3px;
  color:var(--gold);
  transition:all .24s ease;
}
.art-read .arw{transition:transform .24s ease}
.art-item:hover .art-read{color:var(--navy)}
.art-item:hover .art-read .arw{transform:translateX(4px)}

.list-end{
  margin-top:22px;text-align:center;font-size:13px;color:var(--muted);
  padding:18px;border:1px dashed var(--line);border-radius:var(--radius);
  background:rgba(255,255,255,.6);
}

.site-footer{background:var(--navy);color:#9fb3d1;padding:34px 0;font-size:13.5px}
.footer-inner{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;line-height:2}
.site-footer a{color:#cfd9e8;transition:color .2s}
.site-footer a:hover{color:var(--gold-light)}

@media (max-width:640px){
  .page-hero{padding:44px 0 40px}
  .section{padding:30px 0 48px}
  .art-item{padding:24px 22px 22px}
  .art-item::before{top:20px;bottom:20px}
  .art-title{font-size:19px}
  .art-read{
    position:static;
    margin-top:16px;
    display:inline-flex;
  }
  .art-meta{padding-bottom:0}
}
</style>
</head>
<body>

<main>

  <section class="page-hero">
    <div class="wrap">
      <p class="crumb"><a href="../">首页</a><span>/</span>文章</p>
      <h1>文章</h1>
      <p class="sub">同学原创随笔与佳作。</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">

      <div class="list-head">
        <h2>文章列表</h2>
        <div class="count">共 <b>1</b> 篇</div>
      </div>

      <div class="art-list">

        <a class="art-item" href="douququ">
          <span class="art-genre">小小说</span>

          <h3 class="art-title">斗蛐蛐</h3>

          <div class="art-meta">
            <span class="author">
              <span class="avatar">
                <svg viewBox="0 0 24 24">
                  <circle cx="12" cy="8" r="4"/>
                  <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>
                </svg>
              </span>
              G202104 lzx
            </span>
            <span class="dot"></span>
            <span class="date">2026年9月20日</span>
          </div>

          <span class="art-read">
            阅读全文 <span class="arw">→</span>
          </span>
        </a>

      </div>

      <p class="list-end">已经到底啦 · 欢迎同学投稿你的作品</p>

    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <div>
      <strong style="color:#fff">南京外国语学校 G202301</strong><br>
      班级官网 · 由 G20230151 维护
    </div>
    <div>
      <a href="../submit">投稿</a> ·
      联系 QQ：3051455202 / 3073701418
    </div>
  </footer>

<script>
  if (location.pathname.endsWith('/index.html')) {
    history.replaceState(null, '', location.pathname.replace(/index\.html$/, ''));
  }
</script>

</body>
</html>
