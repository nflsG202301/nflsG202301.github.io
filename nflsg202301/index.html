<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>套娃 · 南京外国语学校 G202301</title>
<meta name="description" content="禁止套娃 No matryoshka dolls!">
<style>
:root{
  --navy:#0f2547; --navy-2:#1b3a63;
  --gold:#c9a227; --gold-light:#e8c96a;
  --bg:#f4f6fb; --card:#ffffff;
  --text:#1f2937; --muted:#6b7280; --line:#e5e9f2;
  --radius:16px;
  --shadow:0 10px 30px rgba(15,37,71,.08);
  --shadow-hover:0 18px 40px rgba(15,37,71,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
ul,ol{list-style:none}
.wrap{width:100%;max-width:1100px;margin:0 auto;padding:0 20px;position:relative;z-index:1}

.page-hero{
  position:relative;overflow:hidden;
  padding:56px 0 52px;color:#fff;
  background:
    radial-gradient(760px 340px at 10% 0%, rgba(201,162,39,.20), transparent 62%),
    radial-gradient(680px 340px at 92% 20%, rgba(88,140,220,.26), transparent 62%),
    linear-gradient(160deg,#0f2547 0%,#1b3a63 60%,#14304f 100%);
}
.page-hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.08) 1px, transparent 1px);
  background-size:24px 24px;opacity:.4;
}
.page-hero h1{font-size:clamp(28px,4.4vw,40px);letter-spacing:2px;margin-bottom:0;line-height:1.4}
.crumb{font-size:13px;color:#9fb3d1;margin-bottom:14px;letter-spacing:1px}
.crumb a:hover{color:var(--gold-light)}
.crumb span{margin:0 7px;opacity:.6}

.section{padding:48px 0 80px}
.container{max-width:820px;margin:0 auto}

.back-bar{margin-bottom:24px}
.back-btn{
  display:inline-flex;align-items:center;gap:8px;
  font-size:14px;font-weight:600;color:var(--navy);
  background:#fff;border:1px solid var(--line);border-radius:999px;
  padding:9px 20px;box-shadow:var(--shadow);transition:all .24s ease;
}
.back-btn:hover{
  transform:translateX(-3px);
  border-color:rgba(201,162,39,.6);
  box-shadow:var(--shadow-hover);
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:88px 48px 80px;
  text-align:center;
  animation:rise .5s ease both;
}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* 巨大的「禁止套娃」—— padding-left 抵消字距偏移 */
.card-text{
  font-size:clamp(42px,10vw,96px);
  font-weight:900;
  letter-spacing:8px;
  padding-left:8px;
  color:var(--navy);
  line-height:1.15;
  margin-bottom:34px;
}

.card-text-en{
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(17px,2.6vw,24px);
  font-style:italic;
  font-weight:600;
  letter-spacing:1.5px;
  color:#a8791a;
  line-height:1.6;
}

.site-footer{
  background:var(--navy);color:#9fb3d1;
  padding:34px 0;font-size:13.5px;
}
.footer-inner{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;line-height:2}
.site-footer a{color:#cfd9e8;transition:color .2s}
.site-footer a:hover{color:var(--gold-light)}

@media (max-width:640px){
  .page-hero{padding:44px 0 40px}
  .section{padding:30px 0 60px}
  .card{padding:64px 22px 60px}
  .card-text{
    letter-spacing:5px;
    padding-left:5px;
    margin-bottom:26px;
  }
}
</style>
</head>
<body>

<main>

  <section class="page-hero">
    <div class="wrap">
      <p class="crumb">
        <a href="../../">首页</a><span>/</span>套娃
      </p>
      <h1>套娃</h1>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="container">

        <div class="back-bar">
          <a class="back-btn" href="../../">← 返回首页</a>
        </div>

        <div class="card">

          <p class="card-text">禁止套娃</p>

          <p class="card-text-en">No matryoshka dolls!</p>

        </div>

      </div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <div>
      <strong style="color:#fff">南京外国语学校 G202301</strong><br>
      班级官网 · 由 G20230151 维护
    </div>
    <div>
      <a href="../../">首页</a> ·
      联系 QQ：3051455202 / 3073701418
    </div>
  </div>
</footer>

<script>
  if (location.pathname.endsWith('/index.html')) {
    history.replaceState(null, '', location.pathname.replace(/index\.html$/, ''));
  }
</script>

</body>
</html>
