<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>贪吃蛇</title>
<style>
  :root {
    --bg: #0f1117;
    --line: #262c3b;
    --muted: #8b93a7;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
  }

  body {
    background: radial-gradient(1100px 700px at 50% -15%, #1b2133 0%, var(--bg) 60%);
    color: #e9edf7;
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex;
    justify-content: center;
    padding: 16px 12px 28px;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }

  .app {
    width: min(100%, 480px);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .head { text-align: center; }
  .head h1 {
    margin: 0 0 12px;
    font-size: 24px;
    letter-spacing: 6px;
    font-weight: 800;
    color: #dfe6f8;
  }

  .hud { display: flex; gap: 10px; }
  .score-box {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 9px 4px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: linear-gradient(180deg, rgba(38, 48, 74, .7), rgba(20, 25, 38, .7));
  }
  .score-box span {
    font-size: 10.5px;
    letter-spacing: 1.6px;
    color: var(--muted);
  }
  .score-box strong {
    font-size: 20px;
    font-variant-numeric: tabular-nums;
    color: #fff;
  }

  .snake-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 10px 34px rgba(0, 0, 0, .45), inset 0 0 0 1px rgba(120, 150, 255, .1);
    touch-action: none;
  }
  #snakeCanvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .hint {
    margin: 0;
    text-align: center;
    font-size: 11.5px;
    color: #6f7891;
    letter-spacing: .3px;
  }

  .btn {
    align-self: center;
    padding: 10px 30px;
    border-radius: 22px;
    border: 1px solid #38415c;
    background: #1c2233;
    color: #c8d1e8;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    cursor: pointer;
    transition: background .18s, color .18s, border-color .18s;
  }
  .btn:hover { background: #252d44; color: #fff; border-color: #4b577a; }
  .btn:active { transform: scale(.96); }

  .overlay {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: none;
    place-items: center;
    text-align: center;
    padding: 18px;
    background: rgba(8, 12, 22, .8);
    backdrop-filter: blur(3px);
    border-radius: 12px;
  }
  .overlay.show { display: grid; }
  .overlay h2 {
    margin: 0 0 14px;
    font-size: 21px;
    letter-spacing: 2px;
    color: #fff;
  }
  .overlay button {
    padding: 10px 26px;
    border: none;
    border-radius: 20px;
    background: linear-gradient(180deg, #5b8cff, #3f6ae0);
    color: #fff;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(70, 120, 255, .4);
  }
  .overlay button:active { transform: scale(.95); }
</style>
</head>
<body>

<div class="app">
  <header class="head">
    <h1>贪吃蛇</h1>
  </header>

  <div class="hud">
    <div class="score-box"><span>分数</span><strong id="score">0</strong></div>
    <div class="score-box"><span>最高</span><strong id="best">0</strong></div>
  </div>

  <div class="snake-wrap">
    <canvas id="snakeCanvas"></canvas>
    <div class="overlay" id="overlay">
      <div>
        <h2 id="ovTitle"></h2>
        <button id="ovBtn" type="button"></button>
      </div>
    </div>
  </div>

  <p class="hint">方向键 / WASD 控制 · 空格暂停 · 手机滑动屏幕</p>
  <button class="btn" id="newGame" type="button">新游戏</button>
</div>

<script>
(function () {
  'use strict';

  const COLS = 20;
  const ROWS = 20;

  const canvas  = document.getElementById('snakeCanvas');
  const ctx     = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl  = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovBtn   = document.getElementById('ovBtn');
  const newBtn  = document.getElementById('newGame');

  let snake, dir, pending, food, score, best, alive, paused;
  let acc = 0, stepMs = 150, lastTime = 0;
  let cell = 20, offX = 0, offY = 0, viewW = 0, viewH = 0, dpr = 1;
  let ovAction = null;

  try { best = parseInt(localStorage.getItem('snake-best') || '0', 10) || 0; }
  catch (e) { best = 0; }

  /* ---- 尺寸 ---- */
  function fitCanvas() {
    const rect = canvas.getBoundingClientRect();
    const w = Math.max(1, Math.round(rect.width));
    const h = Math.max(1, Math.round(rect.height));

    dpr = window.devicePixelRatio || 1;
    canvas.width  = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    viewW = w;
    viewH = h;
    cell = Math.min(w / COLS, h / ROWS);
    offX = (w - cell * COLS) / 2;
    offY = (h - cell * ROWS) / 2;
  }

  /* ---- 遮罩 ---- */
  function showOverlay(title, btnText, action) {
    ovTitle.textContent = title;
    ovBtn.textContent = btnText;
    ovAction = action;
    overlay.classList.add('show');
  }
  function hideOverlay() {
    overlay.classList.remove('show');
    ovAction = null;
  }
  ovBtn.addEventListener('click', () => { if (ovAction) ovAction(); });

  /* ---- HUD ---- */
  function updateHUD() {
    if (score > best) {
      best = score;
      try { localStorage.setItem('snake-best', String(best)); } catch (e) {}
    }
    scoreEl.textContent = score;
    bestEl.textContent = best;
  }

  /* ---- 食物 ---- */
  function spawnFood() {
    const occupied = new Set(snake.map(s => s.x + ',' + s.y));
    const free = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (!occupied.has(x + ',' + y)) free.push({ x: x, y: y });
      }
    }
    if (!free.length) {
      food = null;
      alive = false;
      showOverlay('🏆 完美通关！', '再来一局', reset);
      return;
    }
    food = free[Math.floor(Math.random() * free.length)];
  }

  /* ---- 重置 ---- */
  function reset() {
    snake = [
      { x: 8, y: 10 },
      { x: 7, y: 10 },
      { x: 6, y: 10 },
      { x: 5, y: 10 }
    ];
    dir = { x: 1, y: 0 };
    pending = [];
    score = 0;
    stepMs = 150;
    acc = 0;
    lastTime = 0;
    alive = true;
    paused = false;
    spawnFood();
    updateHUD();
    hideOverlay();
  }

  /* ---- 死亡 ---- */
  function gameOver() {
    alive = false;
    showOverlay('游戏结束 · 得分 ' + score, '再来一局', reset);
  }

  /* ---- 方向 ---- */
  function pushDir(d) {
    if (!alive || paused) return;
    const last = pending.length ? pending[pending.length - 1] : dir;
    if (d.x === -last.x && d.y === -last.y) return;
    if (d.x === last.x && d.y === last.y) return;
    if (pending.length < 2) pending.push(d);
  }

  /* ---- 单步 ---- */
  function step() {
    if (pending.length) dir = pending.shift();

    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      gameOver();
      return;
    }

    const eating = food && head.x === food.x && head.y === food.y;
    const body = eating ? snake : snake.slice(0, -1);
    for (let i = 0; i < body.length; i++) {
      if (body[i].x === head.x && body[i].y === head.y) {
        gameOver();
        return;
      }
    }

    snake.unshift(head);

    if (eating) {
      score += 10;
      updateHUD();
      spawnFood();
      stepMs = Math.max(70, 150 - Math.floor(score / 50) * 8);
    } else {
      snake.pop();
    }
  }

  /* ---- 暂停 ---- */
  function togglePause() {
    if (!alive) return;
    paused = !paused;
    if (paused) {
      showOverlay('已暂停', '继续游戏', () => {
        paused = false;
        hideOverlay();
        lastTime = 0;
      });
    } else {
      hideOverlay();
    }
  }

  /* ---- 绘制 ---- */
  function roundRect(c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function draw(time) {
    ctx.fillStyle = '#0d111c';
    ctx.fillRect(0, 0, viewW, viewH);

    // 棋盘格
    ctx.fillStyle = 'rgba(255,255,255,0.022)';
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if ((x + y) % 2 === 0) {
          ctx.fillRect(offX + x * cell, offY + y * cell, cell, cell);
        }
      }
    }

    // 边框
    ctx.strokeStyle = 'rgba(120,150,255,0.16)';
    ctx.lineWidth = 2;
    ctx.strokeRect(offX + 1, offY + 1, cell * COLS - 2, cell * ROWS - 2);

    // 食物
    if (food) {
      const pulse = 1 + Math.sin(time / 210) * 0.1;
      const cx = offX + food.x * cell + cell / 2;
      const cy = offY + food.y * cell + cell / 2;
      ctx.save();
      ctx.shadowColor = 'rgba(255, 92, 108, .95)';
      ctx.shadowBlur = cell * 0.9;
      ctx.fillStyle = '#ff5c6c';
      ctx.beginPath();
      ctx.arc(cx, cy, cell * 0.3 * pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 蛇身
    for (let i = snake.length - 1; i >= 0; i--) {
      const s = snake[i];
      const t = snake.length > 1 ? i / (snake.length - 1) : 0;
      const light = 63 - t * 27;
      ctx.fillStyle = 'hsl(152, 68%, ' + light + '%)';
      roundRect(ctx,
        offX + s.x * cell + 1,
        offY + s.y * cell + 1,
        cell - 2, cell - 2, cell * 0.28);
      ctx.fill();
    }

    // 蛇眼
    if (snake.length) {
      const h = snake[0];
      const cx = offX + h.x * cell + cell / 2;
      const cy = offY + h.y * cell + cell / 2;
      const fx = dir.x * cell * 0.13;
      const fy = dir.y * cell * 0.13;
      const px = -dir.y * cell * 0.17;
      const py = dir.x * cell * 0.17;

      ctx.fillStyle = '#04121c';
      ctx.beginPath();
      ctx.arc(cx + fx + px, cy + fy + py, cell * 0.09, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx + fx - px, cy + fy - py, cell * 0.09, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* ---- 主循环 ---- */
  function loop(time) {
    requestAnimationFrame(loop);

    if (!lastTime) lastTime = time;
    let dt = time - lastTime;
    lastTime = time;
    if (dt > 120) dt = 120;

    if (alive && !paused) {
      acc += dt;
      let guard = 0;
      while (acc >= stepMs && guard++ < 6) {
        acc -= stepMs;
        if (!alive) break;
        step();
      }
    }

    draw(time);
  }

  /* ---- 键盘 ---- */
  const KEYMAP = {
    ArrowUp:    { x: 0,  y: -1 },
    ArrowDown:  { x: 0,  y: 1 },
    ArrowLeft:  { x: -1, y: 0 },
    ArrowRight: { x: 1,  y: 0 },
    w: { x: 0, y: -1 }, s: { x: 0, y: 1 }, a: { x: -1, y: 0 }, d: { x: 1, y: 0 },
    W: { x: 0, y: -1 }, S: { x: 0, y: 1 }, A: { x: -1, y: 0 }, D: { x: 1, y: 0 }
  };

  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;

    if (e.key === ' ') {
      e.preventDefault();
      togglePause();
      return;
    }

    const d = KEYMAP[e.key];
    if (d) {
      e.preventDefault();
      pushDir(d);
    }
  });

  /* ---- 触摸滑动 ---- */
  let ts = null;

  canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    e.preventDefault();
    ts = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: false });

  canvas.addEventListener('touchend', (e) => {
    if (!ts) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - ts.x;
    const dy = t.clientY - ts.y;
    ts = null;

    if (Math.max(Math.abs(dx), Math.abs(dy)) < 22) {
      togglePause();
      return;
    }
    if (Math.abs(dx) > Math.abs(dy)) pushDir({ x: dx > 0 ? 1 : -1, y: 0 });
    else pushDir({ x: 0, y: dy > 0 ? 1 : -1 });
  }, { passive: true });

  /* ---- 尺寸监听 ---- */
  if (window.ResizeObserver) {
    new ResizeObserver(fitCanvas).observe(canvas);
  } else {
    window.addEventListener('resize', fitCanvas);
  }

  newBtn.addEventListener('click', reset);

  /* 启动 */
  fitCanvas();
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
