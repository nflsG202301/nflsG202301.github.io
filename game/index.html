<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>游戏 · 南京外国语学校 G202301</title>
<meta name="description" content="南京外国语学校 G202301 班休闲游戏：Wordle、俄罗斯方块、2048、贪吃蛇。">
<style>
:root{--navy:#0f2547;--navy-2:#1b3a63;--gold:#c9a227;--gold-light:#e8c96a;--bg:#f4f6fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e9f2;--radius:16px;--shadow:0 10px 30px rgba(15,37,71,.08);--shadow-hover:0 18px 40px rgba(15,37,71,.16)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
ul,ol{list-style:none}
.wrap{width:100%;max-width:1100px;margin:0 auto;padding:0 20px;position:relative;z-index:1}

/* 页面头部 */
.page-hero{position:relative;overflow:hidden;padding:56px 0 52px;color:#fff;background:radial-gradient(760px 340px at 10% 0%,rgba(201,162,39,.20),transparent 62%),radial-gradient(680px 340px at 92% 20%,rgba(88,140,220,.26),transparent 62%),linear-gradient(160deg,#0f2547 0%,#1b3a63 60%,#14304f 100%)}
.page-hero::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px);background-size:24px 24px;opacity:.4}
.page-hero h1{font-size:clamp(28px,4.4vw,40px);letter-spacing:1px;margin-bottom:12px}
.page-hero .sub{color:#c3d2e6;font-size:15px;max-width:640px}
.crumb{font-size:13px;color:#9fb3d1;margin-bottom:14px;letter-spacing:1px}
.crumb a:hover{color:var(--gold-light)}
.crumb span{margin:0 7px;opacity:.6}

/* 内容区 */
.section{padding:40px 0 72px}

/* ============ 游戏图标网格（手机桌面风格） ============ */
.app-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(88px, 1fr));
  gap:26px 16px;
  max-width:560px;
}

.app-item{
  display:flex;flex-direction:column;align-items:center;gap:9px;
  text-align:center;
  animation:rise .4s ease both;
}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.app-icon{
  width:64px;height:64px;
  display:block;
  filter:drop-shadow(0 6px 14px rgba(15,37,71,.18));
  transition:transform .24s ease, filter .24s ease;
}
.app-item:hover .app-icon{
  transform:translateY(-4px) scale(1.05);
  filter:drop-shadow(0 12px 22px rgba(15,37,71,.28));
}

.app-name{
  font-size:12.5px;font-weight:600;letter-spacing:.2px;
  color:var(--navy);
  line-height:1.35;
  max-width:88px;
  word-break:break-word;
}

/* 禁用（即将上线） */
.app-item.coming{cursor:not-allowed}
.app-item.coming .app-icon{filter:none}
.app-item.coming .app-name{color:#b8c0cc}
.app-item.coming:hover .app-icon{transform:none;filter:none}

/* 页脚 */
.site-footer{background:var(--navy);color:#9fb3d1;padding:34px 0;font-size:13.5px;margin-top:20px}
.footer-inner{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;line-height:2}
.site-footer a{color:#cfd9e8;transition:color .2s}
.site-footer a:hover{color:var(--gold-light)}

@media (max-width:640px){
  .page-hero{padding:44px 0 40px}
  .section{padding:28px 0 52px}
  .app-grid{grid-template-columns:repeat(4, 1fr);gap:22px 10px;max-width:none}
  .app-icon{width:58px;height:58px}
  .app-name{font-size:11.5px;max-width:72px}
}
</style>
</head>
<body>

<main>

  <section class="page-hero">
    <div class="wrap">
      <p class="crumb"><a href="../">首页</a><span>/</span>游戏</p>
      <h1>游戏</h1>
      <p class="sub">课间放松一下，玩玩休闲小游戏。</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">

      <div class="app-grid">

        <!-- Wordle：字母方块 -->
        <a class="app-item" href="./wordle.html">
          <svg class="app-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <linearGradient id="wlBg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#6aaa64"/>
                <stop offset="1" stop-color="#3e7a3a"/>
              </linearGradient>
            </defs>
            <rect width="64" height="64" rx="15" fill="url(#wlBg)"/>
            <g fill="#ffffff">
              <rect x="11" y="11" width="18" height="18" rx="3.5"/>
              <rect x="35" y="11" width="18" height="18" rx="3.5"/>
              <rect x="11" y="35" width="18" height="18" rx="3.5"/>
              <rect x="35" y="35" width="18" height="18" rx="3.5"/>
            </g>
            <g font-family="Arial, Helvetica, sans-serif"
               font-size="13" font-weight="900" fill="#3e7a3a" text-anchor="middle">
              <text x="20" y="24.6">W</text>
              <text x="44" y="24.6">O</text>
              <text x="20" y="48.6">R</text>
              <text x="44" y="48.6">D</text>
            </g>
          </svg>
          <span class="app-name">Wordle</span>
        </a>

        <!-- 俄罗斯方块：T 形方块 -->
        <a class="app-item" href="./tetris.html">
          <svg class="app-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <linearGradient id="tsBg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#1b3a63"/>
                <stop offset="1" stop-color="#0f2547"/>
              </linearGradient>
            </defs>
            <rect width="64" height="64" rx="15" fill="url(#tsBg)"/>
            <g stroke="rgba(255,255,255,.28)" stroke-width="1">
              <rect x="9"  y="17" width="14" height="14" rx="2.5" fill="#e8763a"/>
              <rect x="25" y="17" width="14" height="14" rx="2.5" fill="#e8763a"/>
              <rect x="41" y="17" width="14" height="14" rx="2.5" fill="#e8763a"/>
              <rect x="25" y="33" width="14" height="14" rx="2.5" fill="#e8763a"/>
            </g>
          </svg>
          <span class="app-name">俄罗斯方块</span>
        </a>

        <!-- 2048：数字方块 -->
        <a class="app-item" href="./2048.html">
          <svg class="app-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <linearGradient id="g2048Bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#edc22e"/>
                <stop offset="1" stop-color="#bb8a1e"/>
              </linearGradient>
            </defs>
            <rect width="64" height="64" rx="15" fill="url(#g2048Bg)"/>
            <g fill="#ffffff">
              <rect x="10" y="10" width="20" height="20" rx="3.5"/>
              <rect x="34" y="10" width="20" height="20" rx="3.5"/>
              <rect x="10" y="34" width="20" height="20" rx="3.5"/>
              <rect x="34" y="34" width="20" height="20" rx="3.5"/>
            </g>
            <g font-family="Arial, Helvetica, sans-serif"
               font-size="11.5" font-weight="900" fill="#9c6b12" text-anchor="middle">
              <text x="20" y="24.6">2</text>
              <text x="44" y="24.6">4</text>
              <text x="20" y="48.6">8</text>
              <text x="44" y="48.6" font-size="9.5">16</text>
            </g>
          </svg>
          <span class="app-name">2048</span>
        </a>

        <!-- 贪吃蛇：蛇身 + 食物 -->
        <a class="app-item" href="./snake.html">
          <svg class="app-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <linearGradient id="snBg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#3fb87a"/>
                <stop offset="1" stop-color="#1e7a4e"/>
              </linearGradient>
            </defs>
            <rect width="64" height="64" rx="15" fill="url(#snBg)"/>
            <g stroke="rgba(255,255,255,.10)" stroke-width="0.8">
              <line x1="0" y1="21.3" x2="64" y2="21.3"/>
              <line x1="0" y1="42.7" x2="64" y2="42.7"/>
              <line x1="21.3" y1="0" x2="21.3" y2="64"/>
              <line x1="42.7" y1="0" x2="42.7" y2="64"/>
            </g>
            <g fill="#ffffff">
              <rect x="11" y="11" width="18" height="18" rx="4"/>
              <rect x="11" y="32" width="18" height="18" rx="4"/>
              <rect x="32" y="32" width="18" height="18" rx="4"/>
            </g>
            <g fill="#1e7a4e">
              <circle cx="20" cy="18" r="2.4"/>
              <circle cx="28" cy="18" r="2.4"/>
            </g>
            <g>
              <circle cx="46" cy="18" r="6.5" fill="#e0524d"/>
              <circle cx="44" cy="16" r="2" fill="rgba(255,255,255,.55)"/>
              <path d="M46 11 q2 -3 4 -3" stroke="#6b4a1f" stroke-width="1.6"
                    fill="none" stroke-linecap="round"/>
            </g>
          </svg>
          <span class="app-name">贪吃蛇</span>
        </a>

      </div>

    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <div>
      <strong style="color:#fff">南京外国语学校 G202301</strong><br>
      班级官网 · 由 G20230151 维护
    </div>
    <div>
      <a href="../">首页</a> ·
      联系 QQ：3051455202 / 3073701418
    </div>
  </div>
</footer>

<script>
  if (location.pathname.endsWith('/index.html')) {
    history.replaceState(null, '', location.pathname.replace(/index\.html$/, ''));
  }
</script>

</body>
</html>
