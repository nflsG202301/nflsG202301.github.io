<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>名言 · 南京外国语学校 G202301</title>
<meta name="description" content="南京外国语学校 G202301 班课堂名言合集。">
<style>
:root{
  --navy:#0f2547; --navy-2:#1b3a63;
  --gold:#c9a227; --gold-light:#e8c96a;
  --bg:#f4f6fb; --card:#ffffff;
  --text:#1f2937; --muted:#6b7280; --line:#e5e9f2;
  --radius:16px;
  --shadow:0 10px 30px rgba(15,37,71,.08);
  --shadow-hover:0 18px 40px rgba(15,37,71,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
ul,ol{list-style:none}
.wrap{width:100%;max-width:1100px;margin:0 auto;padding:0 20px;position:relative;z-index:1}

.page-hero{
  position:relative;overflow:hidden;
  padding:56px 0 52px;color:#fff;
  background:
    radial-gradient(760px 340px at 10% 0%, rgba(201,162,39,.20), transparent 62%),
    radial-gradient(680px 340px at 92% 20%, rgba(88,140,220,.26), transparent 62%),
    linear-gradient(160deg,#0f2547 0%,#1b3a63 60%,#14304f 100%);
}
.page-hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.08) 1px, transparent 1px);
  background-size:24px 24px;opacity:.4;
}
.page-hero h1{font-size:clamp(28px,4.4vw,40px);letter-spacing:1px;margin-bottom:12px}
.page-hero .sub{color:#c3d2e6;font-size:15px;max-width:680px}
.crumb{font-size:13px;color:#9fb3d1;margin-bottom:14px;letter-spacing:1px}
.crumb a:hover{color:var(--gold-light)}
.crumb span{margin:0 7px;opacity:.6}

.section{padding:40px 0 64px}

/* 筛选 */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.filter-btn{
  display:inline-flex;align-items:center;gap:7px;
  border:1px solid var(--line);background:#fff;color:var(--muted);
  font-size:13.5px;font-weight:600;padding:8px 16px;border-radius:999px;
  cursor:pointer;font-family:inherit;transition:all .22s ease;
}
.filter-btn .dot{
  width:8px;height:8px;border-radius:50%;background:var(--c,#94a3b8);
  transition:all .22s ease;
}
.filter-btn:hover{border-color:var(--c,#c9a227);color:var(--navy)}
.filter-btn.active{
  color:#fff;border-color:transparent;
  background:var(--c,#c9a227);
  box-shadow:0 6px 16px rgba(15,37,71,.18);
}
.filter-btn.active .dot{background:rgba(255,255,255,.9)}

/* 统计条 */
.bar{
  display:flex;align-items:center;justify-content:space-between;
  gap:14px;flex-wrap:wrap;margin-bottom:18px;
}
.bar .now{
  font-size:16px;font-weight:700;color:var(--navy);letter-spacing:.5px;
  display:flex;align-items:center;gap:9px;
}
.bar .now::before{
  content:"";width:9px;height:9px;border-radius:50%;
  background:var(--gold);box-shadow:0 0 0 4px rgba(201,162,39,.18);
}
.bar-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bar .num{font-size:13.5px;color:var(--muted)}
.bar .num b{color:var(--navy)}

/* 随机按钮 */
.random-btn{
  display:inline-flex;align-items:center;gap:8px;
  border:none;cursor:pointer;font-family:inherit;
  font-size:13.5px;font-weight:700;letter-spacing:.5px;
  padding:9px 20px;border-radius:999px;
  color:var(--navy);
  background:linear-gradient(135deg,var(--gold-light),var(--gold));
  box-shadow:0 8px 20px rgba(201,162,39,.32);
  transition:all .24s ease;
}
.random-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 26px rgba(201,162,39,.48);
}
.random-btn:active{transform:translateY(0)}
.random-btn .dice{
  font-size:16px;line-height:1;
  display:inline-block;
  transition:transform .4s cubic-bezier(.34,1.56,.64,1);
}
.random-btn.spin .dice{transform:rotate(360deg)}

/* 名言网格 */
.sayings{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:16px;
}
.saying{
  position:relative;
  background:var(--card);
  border:1px solid var(--line);
  border-left:5px solid var(--c,#94a3b8);
  border-radius:14px;
  padding:22px 24px 18px;
  box-shadow:var(--shadow);
  transition:transform .26s ease, box-shadow .26s ease;
  animation:rise .4s ease both;
}
.saying:hover{transform:translateY(-5px);box-shadow:var(--shadow-hover)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.saying .quote-mark{
  position:absolute;top:6px;right:18px;
  font-size:64px;line-height:1;color:rgba(15,37,71,.05);
  font-family:Georgia,serif;pointer-events:none;
}
.saying-text{
  font-size:15.5px;line-height:1.8;color:#2c3644;
  letter-spacing:.3px;margin-bottom:14px;position:relative;
  word-break:break-word;
}
.saying-by{
  display:inline-flex;align-items:center;
  font-size:12.5px;font-weight:700;letter-spacing:.5px;
  color:var(--c,#64748b);
  padding:3px 11px;border-radius:7px;
  background:rgba(15,37,71,.05);
}
/* 署名可跳人物志时 */
a.saying-by{
  cursor:pointer;
  transition:transform .2s ease, box-shadow .2s ease, background .2s ease;
}
a.saying-by:hover{
  transform:translateY(-1px);
  box-shadow:0 6px 16px rgba(15,37,71,.14);
  background:rgba(15,37,71,.09);
}
a.saying-by::after{
  content:"→";
  font-size:11px;margin-left:5px;opacity:.7;
}

/* 空 / 加载 / 错误 */
.state{
  text-align:center;padding:70px 30px;
  background:var(--card);border:1px dashed var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);
}
.state .big{font-size:48px;display:block;margin-bottom:16px;opacity:.65}
.state h2{font-size:18px;color:var(--navy);letter-spacing:1px;margin-bottom:8px}
.state p{font-size:14px;color:var(--muted)}
.state.error{color:#c2453c}
.state.error h2{color:#c2453c}

/* ============ 随机弹窗 ============ */
.rand-mask{
  position:fixed;inset:0;z-index:999;
  display:none;place-items:center;
  padding:20px;
  background:rgba(8,18,32,.68);
  backdrop-filter:blur(6px);
  animation:fade .22s ease both;
}
.rand-mask.open{display:grid}
@keyframes fade{from{opacity:0}to{opacity:1}}

.rand-box{
  position:relative;
  width:100%;max-width:520px;
  background:var(--card);
  border-radius:22px;
  box-shadow:0 30px 80px rgba(0,0,0,.4);
  padding:48px 42px 36px;
  text-align:center;
  animation:pop .32s cubic-bezier(.34,1.56,.64,1) both;
  overflow:hidden;
}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(20px)}to{opacity:1;transform:none}}

.rand-box::before{
  content:"";
  position:absolute;top:0;left:0;right:0;height:5px;
  background:linear-gradient(90deg,var(--gold-light),var(--gold),var(--gold-light));
}

.rand-close{
  position:absolute;top:14px;right:16px;
  width:34px;height:34px;border-radius:50%;
  border:none;background:#f2f5fa;color:var(--muted);
  font-size:18px;line-height:1;cursor:pointer;
  font-family:inherit;transition:all .2s ease;
}
.rand-close:hover{background:#e6ebf4;color:var(--navy);transform:rotate(90deg)}

/* 弹窗大引号 */
.rand-mark{
  font-family:Georgia,serif;
  font-size:90px;line-height:.9;
  color:rgba(201,162,39,.28);
  margin-bottom:-16px;
  display:block;
}

.rand-text{
  font-size:19px;
  line-height:1.9;
  color:var(--navy);
  letter-spacing:.5px;
  margin-bottom:22px;
  word-break:break-word;
  font-weight:500;
}

.rand-by{
  display:inline-flex;align-items:center;gap:6px;
  font-size:13.5px;font-weight:800;letter-spacing:.8px;
  color:var(--c,#a8791a);
  padding:5px 16px;border-radius:999px;
  background:rgba(15,37,71,.05);
  margin-bottom:28px;
}
.rand-by::before{
  content:"—— ";
  opacity:.65;
}
.rand-by a{
  color:inherit;
  border-bottom:1.5px solid rgba(201,162,39,.5);
  transition:border-color .2s ease;
}
.rand-by a:hover{border-bottom-color:currentColor}

.rand-actions{display:flex;gap:10px;justify-content:center}
.rand-btn{
  display:inline-flex;align-items:center;gap:7px;
  border:none;cursor:pointer;font-family:inherit;
  font-size:14px;font-weight:700;letter-spacing:.4px;
  padding:11px 26px;border-radius:999px;
  transition:all .24s ease;
}
.rand-btn.primary{
  color:var(--navy);
  background:linear-gradient(135deg,var(--gold-light),var(--gold));
  box-shadow:0 10px 24px rgba(201,162,39,.35);
}
.rand-btn.primary:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(201,162,39,.5)}
.rand-btn.ghost{
  color:var(--muted);
  background:#f2f5fa;
}
.rand-btn.ghost:hover{color:var(--navy);background:#e6ebf4}
.rand-btn .dice{
  display:inline-block;
  transition:transform .5s cubic-bezier(.34,1.56,.64,1);
}
.rand-btn.spin .dice{transform:rotate(360deg)}

.site-footer{
  background:var(--navy);color:#9fb3d1;
  padding:34px 0;font-size:13.5px;
}
.footer-inner{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;line-height:2}
.site-footer a{color:#cfd9e8;transition:color .2s}
.site-footer a:hover{color:var(--gold-light)}

@media (max-width:640px){
  .page-hero{padding:44px 0 40px}
  .section{padding:30px 0 48px}
  .sayings{grid-template-columns:1fr;gap:12px}
  .saying{padding:18px 20px 16px}
  .saying-text{font-size:14.5px}
  .filters{gap:6px}
  .filter-btn{padding:7px 13px;font-size:13px}
  .bar{align-items:flex-start}
  .random-btn{padding:8px 16px;font-size:13px}
  .rand-box{padding:38px 24px 28px;border-radius:18px}
  .rand-mark{font-size:72px;margin-bottom:-12px}
  .rand-text{font-size:16.5px;line-height:1.85}
  .rand-by{font-size:12.5px;padding:4px 14px;margin-bottom:22px}
  .rand-btn{padding:10px 20px;font-size:13.5px}
}
</style>
</head>
<body>

<main>

  <section class="page-hero">
    <div class="wrap">
      <p class="crumb"><a href="../">首页</a><span>/</span>名言</p>
      <h1>名言</h1>
      <p class="sub">课堂上的金句合集，点击说话者分类即可查看，也可以随机来一条。</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">

      <div class="filters" id="filters"></div>

      <div class="bar">
        <div class="now" id="nowTitle">全部名言</div>
        <div class="bar-right">
          <div class="num">共 <b id="sayCount">—</b> 条</div>
          <button class="random-btn" id="randomBtn">
            <span class="dice">🎲</span>随机一条
          </button>
        </div>
      </div>

      <div class="state" id="loadingState">
        <span class="big">⏳</span>
        <h2>正在加载名言…</h2>
        <p>请稍等片刻</p>
      </div>

      <div class="sayings" id="sayings" style="display:none"></div>

      <div class="state" id="emptyState" style="display:none">
        <span class="big">💬</span>
        <h2>暂无收录</h2>
        <p>该分类下暂时还没有名言，欢迎投稿补充。</p>
      </div>

    </div>
  </section>

</main>

<!-- ===== 随机弹窗 ===== -->
<div class="rand-mask" id="randMask">
  <div class="rand-box" id="randBox">
    <button class="rand-close" id="randClose" aria-label="关闭">✕</button>

    <span class="rand-mark">“</span>
    <div class="rand-text" id="randText">—</div>
    <div class="rand-by" id="randBy">—</div>

    <div class="rand-actions">
      <button class="rand-btn ghost" id="randCloseBtn">关闭</button>
      <button class="rand-btn primary" id="randAgain">
        <span class="dice">🎲</span>再来一条
      </button>
    </div>
  </div>
</div>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <div>
      <strong style="color:#fff">南京外国语学校 G202301</strong><br>
      班级官网 · 由 G20230151 维护
    </div>
    <div>
      <a href="../">首页</a> ·
      联系 QQ：3051455202 / 3073701418
    </div>
  </div>
</footer>

<script>
/* ============================================================
   名言板块
   ------------------------------------------------------------
   1. 从 ./FamousSayings.txt 读取并解析
   2. 分类筛选
   3. 随机一条（弹窗展示）
   ============================================================ */

const CATEGORIES = [
  { key: 'all',       name: '全部',       color: '#0f2547' },
  { key: '语文-韦',   name: '语文-韦',   color: '#c2453c' },
  { key: '数学-唐',   name: '数学-唐',   color: '#2f6bc0' },
  { key: '英语A-柴',  name: '英语A-柴',  color: '#218a55' },
  { key: '英语B-连',  name: '英语B-连',  color: '#0f8a8a' },
  { key: '物理-叶',   name: '物理-叶',   color: '#6b4bc0' },
  { key: '化学-孙',   name: '化学-孙',   color: '#c4761a' },
  { key: '生物-马',   name: '生物-马',   color: '#b04a9b' },
  { key: '地理-王',   name: '地理-王',   color: '#7a9b2a' },
  { key: '政治-周',   name: '政治-周',   color: '#4b5fa8' },
  { key: '历史-周',   name: '历史-周',   color: '#8a6a3a' },
  { key: '其他',      name: '其他',      color: '#64748b' }
];

const AUTHOR_TO_CATEGORY = {
  '语文-韦':  '语文-韦',
  '数学-唐':  '数学-唐',
  '英语A-柴': '英语A-柴',
  '英语B-连': '英语B-连',
  '物理-叶':  '物理-叶',
  '化学-孙':  '化学-孙',
  '生物-马':  '生物-马',
  '地理-王':  '地理-王',
  '政治-周':  '政治-周',
  '历史-周':  '历史-周'
};

const COLOR_MAP = {};
CATEGORIES.forEach(c => COLOR_MAP[c.key] = c.color);

/* 署名对应的人物志：有此映射的署名在名言板块可点击跳转 */
const AUTHOR_TO_BIO = {
  '朱心桥': '/biography/zhuxinqiao/',
  '李泽茼': '/biography/lizetong/'
};

function escapeHtml(s){
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function normalizeAuthor(s){
  return String(s).replace(/[\u2010\u2011\u2012\u2013\u2014\u2015]/g, '-').trim();
}

function parseSayings(text){
  const lines = text.split(/\r?\n/);
  const result = [];

  lines.forEach(function(raw, idx){
    const line = raw.trim();
    if (!line) return;

    let quote  = line;
    let author = '';

    const parts = line.split('——');
    if (parts.length >= 2){
      author = parts.pop().trim();
      quote  = parts.join('——').trim();
    }
    if (!quote) return;

    const normAuthor = normalizeAuthor(author);
    const category   = AUTHOR_TO_CATEGORY[normAuthor] || '其他';
    const color      = COLOR_MAP[category];

    result.push({
      index: idx,
      text: quote,
      author: normAuthor || '未知',
      category: category,
      color: color
    });
  });

  return result;
}

/* ---------- DOM ---------- */
const elFilters  = document.getElementById('filters');
const elSayings  = document.getElementById('sayings');
const elCount    = document.getElementById('sayCount');
const elTitle    = document.getElementById('nowTitle');
const elLoading  = document.getElementById('loadingState');
const elEmpty    = document.getElementById('emptyState');

const randMask   = document.getElementById('randMask');
const randBox    = document.getElementById('randBox');
const randText   = document.getElementById('randText');
const randBy     = document.getElementById('randBy');
const randClose  = document.getElementById('randClose');
const randCloseBtn = document.getElementById('randCloseBtn');
const randAgain  = document.getElementById('randAgain');
const randomBtn  = document.getElementById('randomBtn');

let ALL_SAYINGS = [];
let CURRENT_FILTER = 'all';

function showState(el, opts){
  elLoading.style.display = 'none';
  elEmpty.style.display   = 'none';
  elSayings.style.display = 'none';
  if (!el) return;

  if (opts && opts.error){
    el.className = 'state error';
    el.querySelector('.big').textContent = '⚠️';
    el.querySelector('h2').textContent = '加载失败';
    el.querySelector('p').textContent = opts.message || '请刷新页面后重试';
  } else {
    el.className = 'state';
    el.querySelector('.big').textContent = '💬';
    el.querySelector('h2').textContent = '暂无收录';
    el.querySelector('p').textContent = '该分类下暂时还没有名言，欢迎投稿补充。';
  }
  el.style.display = 'block';
}

function renderFilters(){
  elFilters.innerHTML = '';
  CATEGORIES.forEach(function(c){
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'filter-btn' + (c.key === 'all' ? ' active' : '');
    btn.dataset.filter = c.key;
    btn.style.setProperty('--c', c.color);
    btn.innerHTML = '<span class="dot"></span>' + escapeHtml(c.name);
    elFilters.appendChild(btn);
  });
}

function renderSayings(){
  const list = (CURRENT_FILTER === 'all')
    ? ALL_SAYINGS
    : ALL_SAYINGS.filter(s => s.category === CURRENT_FILTER);

  elCount.textContent = list.length;
  elTitle.textContent = (CURRENT_FILTER === 'all')
    ? '全部名言'
    : CURRENT_FILTER + ' 的名言';

  if (!list.length){
    showState(elEmpty);
    return;
  }

  elLoading.style.display = 'none';
  elEmpty.style.display   = 'none';
  elSayings.style.display = 'grid';
  elSayings.innerHTML = '';

  list.forEach(function(s){
    const div = document.createElement('div');
    div.className = 'saying';
    div.style.setProperty('--c', s.color);
    const bioUrl = AUTHOR_TO_BIO[s.author];
    const byHtml = bioUrl
      ? '<a class="saying-by" href="' + escapeHtml(bioUrl) + '" title="查看 ' +
          escapeHtml(s.author) + ' 的人物志">' + escapeHtml(s.author) + '</a>'
      : '<div class="saying-by">' + escapeHtml(s.author) + '</div>';

    div.innerHTML =
      '<span class="quote-mark">”</span>' +
      '<div class="saying-text">' + escapeHtml(s.text) + '</div>' +
      byHtml;
    elSayings.appendChild(div);
  });
}

/* ---------- 随机一条 ---------- */
function spinDice(el){
  el.classList.remove('spin');
  void el.offsetWidth;   // 重置动画
  el.classList.add('spin');
  setTimeout(() => el.classList.remove('spin'), 600);
}

function showRandom(){
  if (!ALL_SAYINGS.length) return;

  // 优先在当前筛选结果里随机；若当前为「全部」，则在全集中随机
  const pool = (CURRENT_FILTER === 'all')
    ? ALL_SAYINGS
    : ALL_SAYINGS.filter(s => s.category === CURRENT_FILTER);

  const list = pool.length ? pool : ALL_SAYINGS;
  const s = list[Math.floor(Math.random() * list.length)];

  randText.textContent = s.text;

  const bioUrl = AUTHOR_TO_BIO[s.author];
  if (bioUrl){
    randBy.innerHTML = '<a href="' + escapeHtml(bioUrl) + '" title="查看 ' +
      escapeHtml(s.author) + ' 的人物志">' + escapeHtml(s.author) + '</a>';
  } else {
    randBy.textContent = s.author;
  }

  randBox.style.setProperty('--c', s.color);
  randBy.style.setProperty('--c', s.color);

  randMask.classList.add('open');
}

function closeRandom(){
  randMask.classList.remove('open');
}

/* ---------- 绑定 ---------- */
elFilters.addEventListener('click', function(e){
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  CURRENT_FILTER = btn.dataset.filter;
  renderSayings();
});

randomBtn.addEventListener('click', function(){
  spinDice(randomBtn);
  setTimeout(showRandom, 180);   // 让骰子动画先转一下
});

randAgain.addEventListener('click', function(){
  spinDice(randAgain);
  setTimeout(showRandom, 180);
});

randClose.addEventListener('click', closeRandom);
randCloseBtn.addEventListener('click', closeRandom);
randMask.addEventListener('click', function(e){
  if (e.target === randMask) closeRandom();
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && randMask.classList.contains('open')) closeRandom();
});

/* ---------- 主流程 ---------- */
async function init(){
  renderFilters();
  showState(null);

  try{
    const res = await fetch('./FamousSayings.txt', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    ALL_SAYINGS = parseSayings(text);
    renderSayings();
  }catch(err){
    showState(elEmpty, {
      error: true,
      message: '无法加载 FamousSayings.txt：' + err.message +
               '（提示：本地用 file:// 直接打开会失败，请通过 http/https 访问）'
    });
  }
}

init();

/* ---------- 地址栏不显示 index.html ---------- */
if (location.pathname.endsWith('/index.html')) {
  history.replaceState(null, '', location.pathname.replace(/index\.html$/, ''));
}
</script>

</body>
</html>
