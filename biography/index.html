<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人物志 · 南京外国语学校 G202301</title>
<meta name="description" content="南京外国语学校 G202301 班人物志。">
<style>
:root{
  --navy:#0f2547; --navy-2:#1b3a63;
  --gold:#c9a227; --gold-light:#e8c96a;
  --bg:#f4f6fb; --card:#ffffff;
  --text:#1f2937; --muted:#6b7280; --line:#e5e9f2;
  --radius:16px;
  --shadow:0 10px 30px rgba(15,37,71,.08);
  --shadow-hover:0 18px 40px rgba(15,37,71,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
ul,ol{list-style:none}
.wrap{width:100%;max-width:900px;margin:0 auto;padding:0 20px;position:relative;z-index:1}

/* 页面头部 */
.page-hero{
  position:relative;overflow:hidden;
  padding:56px 0 52px;color:#fff;
  background:
    radial-gradient(760px 340px at 10% 0%, rgba(201,162,39,.20), transparent 62%),
    radial-gradient(680px 340px at 92% 20%, rgba(88,140,220,.26), transparent 62%),
    linear-gradient(160deg,#0f2547 0%,#1b3a63 60%,#14304f 100%);
}
.page-hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.08) 1px, transparent 1px);
  background-size:24px 24px;opacity:.4;
}
.page-hero h1{font-size:clamp(28px,4.4vw,40px);letter-spacing:1px;margin-bottom:12px}
.page-hero .sub{color:#c3d2e6;font-size:15px;max-width:640px}
.crumb{font-size:13px;color:#9fb3d1;margin-bottom:14px;letter-spacing:1px}
.crumb a:hover{color:var(--gold-light)}
.crumb span{margin:0 7px;opacity:.6}

.section{padding:40px 0 72px}
.list-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.list-head h2{font-size:17px;letter-spacing:.5px;color:var(--navy);display:flex;align-items:center;gap:9px}
.list-head h2::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(201,162,39,.18)}
.list-head .count{font-size:13.5px;color:var(--muted)}
.list-head .count b{color:var(--navy)}

/* ============ 人物志条目 ============ */
.bio-list{display:flex;flex-direction:column;gap:18px}

.bio-item{
  position:relative;
  display:flex;align-items:center;gap:26px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:26px 34px;
  overflow:hidden;
  transition:transform .28s ease, box-shadow .28s ease, border-color .28s ease;
  animation:rise .45s ease both;
}
.bio-item:hover{
  transform:translateY(-4px);
  box-shadow:var(--shadow-hover);
  border-color:rgba(201,162,39,.55);
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* 左侧金色竖条 */
.bio-item::before{
  content:"";
  position:absolute;left:0;top:26px;bottom:26px;
  width:4px;border-radius:0 4px 4px 0;
  background:linear-gradient(180deg,var(--gold-light),var(--gold));
  transition:top .28s ease, bottom .28s ease;
}
.bio-item:hover::before{top:20px;bottom:20px}

/* 最左侧：照片 */
.bio-photo{
  flex:0 0 auto;
  width:104px;height:130px;
  border-radius:12px;
  overflow:hidden;
  border:1px solid var(--line);
  background:linear-gradient(135deg,#eef2f8,#e0e6f1);
  display:grid;place-items:center;
  color:#a3aec0;
  transition:border-color .28s ease;
}
.bio-item:hover .bio-photo{border-color:rgba(201,162,39,.5)}
.bio-photo img{width:100%;height:100%;object-fit:cover;display:block}
.bio-photo .ph{
  display:grid;place-items:center;gap:6px;
  line-height:1;
}
.bio-photo .ph svg{
  width:32px;height:32px;display:block;
  stroke:currentColor;fill:none;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
}
.bio-photo .ph span{font-size:11px;letter-spacing:.5px}

/* 右侧：名字 + 一行介绍 */
.bio-main{flex:1 1 auto;min-width:0}
.bio-name{
  display:block;
  font-size:clamp(19px,2.6vw,23px);
  font-weight:800;
  letter-spacing:1.5px;
  color:var(--navy);
  margin-bottom:10px;
  transition:color .24s ease;
}
.bio-item:hover .bio-name{color:#a8791a}
.bio-intro{
  display:block;
  font-size:14px;
  color:var(--muted);
  letter-spacing:.3px;
  line-height:1.7;
}

/* 右下角「阅读全文」 */
.bio-read{
  position:absolute;right:34px;bottom:24px;
  display:inline-flex;align-items:center;gap:6px;
  font-size:13.5px;font-weight:700;letter-spacing:.3px;
  color:var(--gold);
  transition:all .24s ease;
}
.bio-read .arw{transition:transform .24s ease}
.bio-item:hover .bio-read{color:var(--navy)}
.bio-item:hover .bio-read .arw{transform:translateX(4px)}

.list-end{
  margin-top:22px;text-align:center;font-size:13px;color:var(--muted);
  padding:18px;border:1px dashed var(--line);border-radius:var(--radius);
  background:rgba(255,255,255,.6);
}

.site-footer{background:var(--navy);color:#9fb3d1;padding:34px 0;font-size:13.5px}
.footer-inner{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;line-height:2}
.site-footer a{color:#cfd9e8;transition:color .2s}
.site-footer a:hover{color:var(--gold-light)}

@media (max-width:640px){
  .page-hero{padding:44px 0 40px}
  .section{padding:30px 0 48px}
  .bio-item{padding:20px 20px 22px;gap:16px;align-items:flex-start;flex-wrap:wrap}
  .bio-item::before{top:18px;bottom:18px}
  .bio-photo{width:76px;height:96px}
  .bio-photo .ph svg{width:24px;height:24px}
  .bio-name{font-size:19px;margin-bottom:8px;letter-spacing:1px}
  .bio-intro{font-size:13.5px}
  .bio-read{flex:0 0 100%;position:static;margin-top:2px;display:inline-flex}
}
</style>
</head>
<body>

<main>

  <section class="page-hero">
    <div class="wrap">
      <p class="crumb"><a href="../">首页</a><span>/</span>人物志</p>
      <h1>人物志</h1>
      <p class="sub">G202301 班的人物档案，记录他们的故事与名言。</p>
    </div>
  </section>

  <section class="section">

      <div class="list-head">

        <div class="count">共 <b>2</b> 人</div>
      </div>

      <div class="bio-list">

          <span class="bio-main">

        <a class="bio-item" href="lizetong">

          <span class="bio-main">

      </div>

      <p class="list-end">已经到底啦 · 人物志持续更新中</p>

    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <div>
      <strong style="color:#fff">南京外国语学校 G202301</strong><br>

</body>
</html>
