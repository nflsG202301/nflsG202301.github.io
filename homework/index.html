a{color:inherit;text-decoration:none}

.page-hero::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px);background-size:24px 24px;opacity:.4}
.page-hero h1{font-size:clamp(28px,4.4vw,40px);letter-spacing:1px;margin-bottom:12px}
.page-hero .sub{color:#c3d2e6;font-size:15px;max-width:640px}
.crumb{font-size:13px;color:#9fb3d1;margin-bottom:14px;letter-spacing:1px}
.crumb a:hover{color:var(--gold-light)}
.crumb span{margin:0 7px;opacity:.6}

.section{padding:40px 0 80px}

.calendar-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:28px 32px 32px;
  animation:rise .5s ease both;
}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.cal-header{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding-bottom:18px;margin-bottom:20px;
  border-bottom:1px solid #f0f3f9;
}
.cal-nav{
  width:40px;height:40px;border-radius:50%;
  border:1px solid var(--line);background:#fff;color:var(--navy);
  font-size:20px;line-height:1;cursor:pointer;font-family:inherit;
  display:grid;place-items:center;transition:all .22s ease;
}
.cal-nav:hover{border-color:rgba(201,162,39,.65);color:var(--gold);transform:scale(1.06)}
.cal-month-wrap{
  flex:1;text-align:center;
  display:flex;align-items:center;justify-content:center;gap:12px;
}
.cal-month{font-size:22px;font-weight:800;letter-spacing:1.5px;color:var(--navy)}
.cal-today-btn{
  font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.5px;
  padding:4px 12px;border-radius:999px;
  color:var(--gold);
  border:1px solid rgba(201,162,39,.55);
  background:linear-gradient(135deg,#fffaf0,#fdf1e0);
  cursor:pointer;transition:all .2s ease;
  white-space:nowrap;
}
.cal-today-btn:hover{
  background:linear-gradient(135deg,var(--gold-light),var(--gold));
  color:var(--navy);border-color:transparent;
}

.cal-info{
  display:flex;align-items:center;justify-content:space-between;
  gap:14px;flex-wrap:wrap;margin-bottom:16px;
}
.cal-count{font-size:13.5px;color:var(--muted)}
.cal-count b{font-size:17px;font-weight:800;color:var(--navy);margin-right:3px}
.cal-legend{display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--muted)}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
.cal-legend i{display:inline-block;width:12px;height:12px;border-radius:4px}
.cal-legend i.gold{background:linear-gradient(135deg,var(--gold-light),var(--gold))}
.cal-legend i.gray{background:#fff;border:1px solid var(--line)}

.cal-weekdays{
  display:grid;grid-template-columns:repeat(7,1fr);
  gap:6px;margin-bottom:6px;
}
.cal-weekdays span{
  text-align:center;font-size:13px;font-weight:700;letter-spacing:.5px;
  color:#9aa6b8;padding:6px 0;
}
.cal-weekdays span.wk{ color:#c2453c }

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}

.cal-day{
  aspect-ratio:1;
  border-radius:12px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:1px;
  background:#fff;border:1px solid var(--line);
  position:relative;
  padding:4px 4px;
  transition:all .24s ease;cursor:default;text-align:center;line-height:1.1;
}
.cal-day .d{
  font-size:17px;font-weight:700;color:#4b5563;
  letter-spacing:.3px;line-height:1.15;
}

.cal-day .lunar{
  font-size:10.5px;
  color:#9aa6b6;
  letter-spacing:0;
  line-height:1.3;
  width:100%;
  padding:0 1px;
  font-weight:500;
  white-space:normal;
  word-break:break-all;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.cal-day .lunar.festival{    color:#c2453c; font-weight:700 }
.cal-day .lunar.observance{  color:#6b7f9e; font-weight:600 }
.cal-day .lunar.term{        color:#a8791a; font-weight:700 }

.cal-day.has-hw{
  background:linear-gradient(135deg,var(--gold-light),var(--gold));
  border-color:transparent;box-shadow:0 4px 12px rgba(201,162,39,.32);
  cursor:pointer;
}
.cal-day.has-hw .d{ color:var(--navy); font-weight:800 }
.cal-day.has-hw .lunar{ opacity:.96 }
.cal-day.has-hw .lunar.festival{    color:#8a2a24 }
.cal-day.has-hw .lunar.observance{  color:#3a4a63 }
.cal-day.has-hw .lunar.term{        color:#5a3f08 }
.cal-day.has-hw .lunar:not(.festival):not(.observance):not(.term){ color:#6b4a08 }
.cal-day.has-hw:hover{ transform:translateY(-4px); box-shadow:0 12px 24px rgba(201,162,39,.5) }

.cal-day.today{ box-shadow:0 0 0 3px rgba(201,162,39,.35), 0 6px 16px rgba(201,162,39,.3) }
.cal-day.has-hw.today{ box-shadow:0 0 0 3px rgba(15,37,71,.28), 0 8px 20px rgba(201,162,39,.45) }

.cal-day.empty{ background:transparent;border:none;pointer-events:none }

.cal-day .d.weekend{ color:#c2453c }
.cal-day.has-hw .d.weekend{ color:var(--navy) }

.back-top{

  border:none;cursor:pointer;font-family:inherit;
  display:grid;place-items:center;color:var(--navy);
  background:linear-gradient(135deg,var(--gold-light),var(--gold));

.back-top.show{opacity:1;visibility:visible;transform:translateY(0) scale(1)}
.back-top:hover{transform:translateY(-3px) scale(1.05);box-shadow:0 20px 40px rgba(201,162,39,.55)}

/* ============================================================
   金色：二十四节气
   ============================================================ */
const SOLAR_TERMS = new Set([
  '立春','雨水','惊蛰','春分','清明','谷雨',
  '立夏','小满','芒种','夏至','小暑','大暑',
  '立秋','处暑','白露','秋分','寒露','霜降',
  '立冬','小雪','大雪','冬至','小寒','大寒'
]);

/* ===== 工具 ===== */
const hwSet = new Set(HOMEWORK);
function pad2(n){ return String(n).padStart(2, '0'); }
function ymd(y, m, d){ return `${y}-${pad2(m + 1)}-${pad2(d)}`; }

const latestDate = [...HOMEWORK].sort().pop() || ymd(new Date().getFullYear(), new Date().getMonth(), 1);
let cursorY = Number(latestDate.slice(0, 4));
let cursorM = Number(latestDate.slice(5, 7)) - 1;

function render(){
  document.getElementById('calMonth').textContent = `${cursorY} 年 ${cursorM + 1} 月`;

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  const daysInMonth = new Date(cursorY, cursorM + 1, 0).getDate();

  let firstWeekday = new Date(cursorY, cursorM, 1).getDay();
  firstWeekday = (firstWeekday + 6) % 7;

  for (let i = 0; i < firstWeekday; i++){
    const cell = document.createElement('div');
    cell.className = 'cal-day empty';
    grid.appendChild(cell);
  }

  const now = new Date();
  const todayStr = ymd(now.getFullYear(), now.getMonth(), now.getDate());

  let count = 0;
  for (let d = 1; d <= daysInMonth; d++){
    const dateStr = ymd(cursorY, cursorM, d);
    const hasHw   = hwSet.has(dateStr);
    const isToday = dateStr === todayStr;

    const wIdx = (firstWeekday + d - 1) % 7;
    const isWeekend = wIdx >= 5;

    const lunarText = LUNAR[dateStr] || '';
    let lunarCls = 'lunar';
    if (lunarText){
      if (FESTIVALS.has(lunarText))        lunarCls += ' festival';
      else if (OBSERVANCES.has(lunarText)) lunarCls += ' observance';
      else if (SOLAR_TERMS.has(lunarText)) lunarCls += ' term';
    }

    let cls = 'cal-day';
    if (hasHw)   cls += ' has-hw';
    if (isToday) cls += ' today';

    let cell;
    if (hasHw){
      cell = document.createElement('a');
      cell.href = dateStr.replace(/-/g, '');
      count++;
    } else {
      cell = document.createElement('div');
    }
    cell.className = cls;

    const dCls = isWeekend && !hasHw ? 'd weekend' : 'd';
    cell.innerHTML =
      `<span class="${dCls}">${d}</span>` +
      (lunarText ? `<span class="${lunarCls}">${lunarText}</span>` : '');

    grid.appendChild(cell);
  }

  document.getElementById('count').textContent = count;
}

function shiftMonth(delta){
  cursorM += delta;
  if (cursorM < 0){ cursorM = 11; cursorY--; }
  if (cursorM > 11){ cursorM = 0;  cursorY++; }
  render();
}

document.getElementById('prevBtn').addEventListener('click', () => shiftMonth(-1));
document.getElementById('nextBtn').addEventListener('click', () => shiftMonth(1));

document.getElementById('todayBtn').addEventListener('click', () => {
  const now = new Date();
  cursorY = now.getFullYear();
  cursorM = now.getMonth();
  render();
});

render();

(function(){
  const btn = document.getElementById('backTop');
  const SHOW_AFTER = 320;
  function update(){
    if (window.scrollY > SHOW_AFTER) btn.classList.add('show');
    else btn.classList.remove('show');
  }
  window.addEventListener('scroll', update, { passive: true });
  update();
  btn.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();

if (location.pathname.endsWith('/index.html')) {
  history.replaceState(null, '', location.pathname.replace(/index\.html$/, ''));
}
