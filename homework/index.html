<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作业 · 南京外国语学校 G202301</title>
<meta name="description" content="南京外国语学校 G202301 班作业发布：按日期查看每日作业安排。">
<style>
:root{
  --navy:#0f2547; --navy-2:#1b3a63;
  --gold:#c9a227; --gold-light:#e8c96a;
  --bg:#f4f6fb; --card:#ffffff;
  --text:#1f2937; --muted:#6b7280; --line:#e5e9f2;
  --radius:16px;
  --shadow:0 10px 30px rgba(15,37,71,.08);
  --shadow-hover:0 18px 40px rgba(15,37,71,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
ul{list-style:none}
.wrap{width:100%;max-width:1100px;margin:0 auto;padding:0 20px;position:relative;z-index:1}

.page-hero{
  position:relative;overflow:hidden;
  padding:56px 0 52px;color:#fff;
  background:
    radial-gradient(760px 340px at 10% 0%, rgba(201,162,39,.20), transparent 62%),
    radial-gradient(680px 340px at 92% 20%, rgba(88,140,220,.26), transparent 62%),
    linear-gradient(160deg,#0f2547 0%,#1b3a63 60%,#14304f 100%);
}
.page-hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.08) 1px, transparent 1px);
  background-size:24px 24px;opacity:.4;
}
.page-hero h1{font-size:clamp(28px,4.4vw,40px);letter-spacing:1px;margin-bottom:12px}
.page-hero .sub{color:#c3d2e6;font-size:15px;max-width:640px}
.crumb{font-size:13px;color:#9fb3d1;margin-bottom:14px;letter-spacing:1px}
.crumb a:hover{color:var(--gold-light)}
.crumb span{margin:0 7px;opacity:.6}

.section{padding:40px 0 64px}

.list-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;flex-wrap:wrap;margin-bottom:22px;
}
.list-head h2{
  font-size:17px;letter-spacing:.5px;color:var(--navy);
  display:flex;align-items:center;gap:9px;
}
.list-head h2::before{
  content:"";width:9px;height:9px;border-radius:50%;
  background:var(--gold);box-shadow:0 0 0 4px rgba(201,162,39,.18);
}
.list-head .count{font-size:13.5px;color:var(--muted)}
.list-head .count b{color:var(--navy)}

.day-list{display:flex;flex-direction:column;gap:16px}
.day-card{
  display:flex;align-items:stretch;
  background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
  transition:transform .26s ease, box-shadow .26s ease, border-color .26s ease;
  animation:rise .45s ease both;
}
.day-card:hover{
  transform:translateY(-5px);
  box-shadow:var(--shadow-hover);
  border-color:rgba(201,162,39,.55);
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.day-date{
  flex:0 0 132px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:20px 10px;color:#fff;text-align:center;
  background:linear-gradient(155deg,var(--navy-2),var(--navy));
  position:relative;
}
.day-date::after{
  content:"";position:absolute;right:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,var(--gold-light),var(--gold));
}
.day-date .y{font-size:12.5px;letter-spacing:3px;color:var(--gold-light);font-weight:600}
.day-date .md{font-size:22px;line-height:1.25;color:#fff;font-weight:700;letter-spacing:1px}
.day-date .w{font-size:12.5px;color:#a9bcd8;letter-spacing:1.5px}

.day-main{flex:1;padding:22px 24px;min-width:0;display:flex;flex-direction:column;justify-content:center}
.day-title{
  font-size:17.5px;font-weight:700;letter-spacing:.3px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.badge-new{
  font-size:11.5px;font-weight:700;padding:2px 10px;border-radius:999px;
  background:linear-gradient(135deg,var(--gold-light),var(--gold));
  color:var(--navy);letter-spacing:.5px;
}

.day-arrow{
  flex:0 0 64px;display:grid;place-items:center;
  font-size:20px;color:#c3cbd8;transition:all .26s ease;
}
.day-card:hover .day-arrow{color:var(--gold);transform:translateX(5px)}

.list-end{
  margin-top:22px;text-align:center;font-size:13px;color:var(--muted);
  padding:18px;border:1px dashed var(--line);border-radius:var(--radius);
  background:rgba(255,255,255,.6);
}

.site-footer{
  background:var(--navy);color:#9fb3d1;
  padding:34px 0;font-size:13.5px;
}
.footer-inner{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;line-height:2}
.site-footer a{color:#cfd9e8;transition:color .2s}
.site-footer a:hover{color:var(--gold-light)}

@media (max-width:640px){
  .page-hero{padding:44px 0 40px}
  .section{padding:30px 0 48px}
  .day-date{flex:0 0 104px;padding:16px 6px}
  .day-date .md{font-size:18px}
  .day-main{padding:16px}
  .day-arrow{flex:0 0 40px;font-size:17px}
  .day-title{font-size:16px}
}
</style>
</head>
<body>

<main>

  <section class="page-hero">
    <div class="wrap">
      <p class="crumb"><a href="../">首页</a><span>/</span>作业</p>
      <h1>作业</h1>
      <p class="sub">每日作业按日期从上到下排列，点击进入当天作业详情。</p>
    </div>

  <section class="section">

          <div class="day-main">
            <div class="day-title">2026年9月17日 作业</div>

        <a class="day-card" href="20260916">

            <div class="day-title">2026年9月16日 作业</div>
          </div>
          <span class="day-arrow">→</span>

        <a class="day-card" href="20260915">

            <span class="y">2026</span>

      <p class="list-end">已经到底啦 · 更早的作业记录会陆续整理上传</p>

    </div>
  </section>

</main>
