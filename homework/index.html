.cal-legend{display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--muted)}

.cal-legend i.gold{background:linear-gradient(135deg,var(--gold-light),var(--gold))}
.cal-legend i.gray{background:#fff;border:1px solid var(--line)}

.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.cal-weekdays span{text-align:center;font-size:13px;font-weight:700;letter-spacing:.5px;color:#9aa6b8;padding:6px 0}
.cal-weekdays span.wk{ color:#c2453c }

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}

.cal-day{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:#fff;border:1px solid var(--line);position:relative;padding:4px 3px;transition:all .24s ease;cursor:default;text-align:center;line-height:1.1}
.cal-day .d{font-size:19px;font-weight:700;color:#4b5563;letter-spacing:.3px;line-height:1.1}

.cal-day.has-hw.today{ box-shadow:0 0 0 3px rgba(15,37,71,.28), 0 8px 20px rgba(201,162,39,.45) }

const LUNAR_BASE = new Date(1900, 0, 31);   // 1900-01-31 = 农历 1900 年正月初一

function leapMonth(y){ return lunarInfo[y - 1900] & 0xf; }
function leapDays(y){
  if (leapMonth(y)) return (lunarInfo[y - 1900] & 0x10000) ? 30 : 29;
  return 0;
}
function monthDays(y, m){
  return (lunarInfo[y - 1900] & (0x10000 >> m)) ? 30 : 29;
}
function lYearDays(y){
  let sum = 348;
  for (let i = 0x8000; i > 0x8; i >>= 1) sum += (lunarInfo[y - 1900] & i) ? 1 : 0;
  return sum + leapDays(y);
}

function solarToLunar(date){
  let offset = Math.floor((date - LUNAR_BASE) / 86400000);
  let y, temp = 0;
  for (y = 1900; y < 2101 && offset > 0; y++){
    temp = lYearDays(y);
    offset -= temp;
  }
  if (offset < 0){ offset += temp; y--; }

  const leap = leapMonth(y);
  let isLeap = false;
  let m;
  for (m = 1; m < 13 && offset > 0; m++){
    if (leap > 0 && m === leap + 1 && !isLeap){
      --m; isLeap = true; temp = leapDays(y);
    } else {
      temp = monthDays(y, m);
    }
    if (isLeap && m === leap + 1) isLeap = false;
    offset -= temp;
  }
  if (offset === 0 && leap > 0 && m === leap + 1){
    if (isLeap){ isLeap = false; } else { isLeap = true; --m; }
  }
  if (offset < 0){ offset += temp; --m; }

  return { year: y, month: m, day: offset + 1, isLeap };
}

const cnNums = ['','一','二','三','四','五','六','七','八','九','十'];
const monthCn = ['','正','二','三','四','五','六','七','八','九','十','冬','腊'];

function dayCn(d){
  if (d === 10) return '初十';
  if (d === 20) return '二十';
  if (d === 30) return '三十';
  if (d < 10)  return '初' + cnNums[d];
  if (d < 20)  return '十' + cnNums[d - 10];
  if (d < 30)  return '廿' + cnNums[d - 20];
  return String(d);
}

function autoLunarText(date){
  const l = solarToLunar(date);
  if (l.day === 1) return (l.isLeap ? '闰' : '') + monthCn[l.month] + '月';
  return dayCn(l.day);
}

/* ============ 组合：有用户数据用用户数据，否则用算法 ============ */
function getTextForDate(dateStr){
  if (LUNAR[dateStr]) return LUNAR[dateStr];
  const [y, m, d] = dateStr.split('-').map(Number);
  return autoLunarText(new Date(y, m - 1, d));
}

/* ============ 工具 ============ */
const hwSet = new Set(HOMEWORK);
function pad2(n){ return String(n).padStart(2, '0'); }
function ymd(y, m, d){ return `${y}-${pad2(m + 1)}-${pad2(d)}`; }

const latestDate = [...HOMEWORK].sort().pop() || ymd(new Date().getFullYear(), new Date().getMonth(), 1);
let cursorY = Number(latestDate.slice(0, 4));
let cursorM = Number(latestDate.slice(5, 7)) - 1;

/* ============ 渲染 ============ */
function render(){
  document.getElementById('calMonth').textContent = `${cursorY} 年 ${cursorM + 1} 月`;

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  const daysInMonth = new Date(cursorY, cursorM + 1, 0).getDate();

  let firstWeekday = new Date(cursorY, cursorM, 1).getDay();
  firstWeekday = (firstWeekday + 6) % 7;

  for (let i = 0; i < firstWeekday; i++){
    const cell = document.createElement('div');
    cell.className = 'cal-day empty';
    grid.appendChild(cell);
  }

  const now = new Date();
  const todayStr = ymd(now.getFullYear(), now.getMonth(), now.getDate());

  let count = 0;
  for (let d = 1; d <= daysInMonth; d++){
    const dateStr = ymd(cursorY, cursorM, d);
    const hasHw   = hwSet.has(dateStr);
    const isToday = dateStr === todayStr;

    const wIdx = (firstWeekday + d - 1) % 7;
    const isWeekend = wIdx >= 5;

    /* 关键：自动计算或使用用户数据 */
    const lunarText = getTextForDate(dateStr);

    let lunarCls = 'lunar';
    if (lunarText){
      if (FESTIVALS.has(lunarText))        lunarCls += ' festival';
      else if (OBSERVANCES.has(lunarText)) lunarCls += ' observance';
      else if (SOLAR_TERMS.has(lunarText)) lunarCls += ' term';
    }

    let cls = 'cal-day';
    if (hasHw)   cls += ' has-hw';
    if (isToday) cls += ' today';

    let cell;
    if (hasHw){
      cell = document.createElement('a');
      cell.href = dateStr.replace(/-/g, '');
      count++;
    } else {
      cell = document.createElement('div');
    }
    cell.className = cls;

    const dCls = isWeekend && !hasHw ? 'd weekend' : 'd';
    cell.innerHTML =
      `<span class="${dCls}">${d}</span>` +
      (lunarText ? `<span class="${lunarCls}">${lunarText}</span>` : '');

    grid.appendChild(cell);
  }

  document.getElementById('count').textContent = count;
}

function shiftMonth(delta){
  cursorM += delta;
  if (cursorM < 0){ cursorM = 11; cursorY--; }
  if (cursorM > 11){ cursorM = 0;  cursorY++; }
  render();
}

document.getElementById('prevBtn').addEventListener('click', () => shiftMonth(-1));
document.getElementById('nextBtn').addEventListener('click', () => shiftMonth(1));

document.getElementById('todayBtn').addEventListener('click', () => {
  const now = new Date();
  cursorY = now.getFullYear();
  cursorM = now.getMonth();
  render();
});

render();

(function(){
  const btn = document.getElementById('backTop');
  const SHOW_AFTER = 320;
  function update(){
    if (window.scrollY > SHOW_AFTER) btn.classList.add('show');
    else btn.classList.remove('show');
  }
  window.addEventListener('scroll', update, { passive: true });
  update();
  btn.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();
