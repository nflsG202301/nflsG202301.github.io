/* =========================================================
   常量与工具
   ========================================================= */
const TYPE_ORDER = ['cn','first','phrase'];
const TYPE_NAME = {
  cn:'根据汉语释义默写单词',
  first:'首字母填空',
  phrase:'同义短语替换'
};
const BADGE = {cn:'<span class="badge b1">中译英</span>',
               first:'<span class="badge b2">首字母填空</span>',
               phrase:'<span class="badge b3">短语替换</span>'};
const TAG_ORDER = ["U1","U2","NCE3-L1","NCE3-L2","NCE3-L3"];

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function norm(s){
  return String(s==null?'':s)
    .toLowerCase()
    .replace(/[’‘]/g,"'")
    .replace(/[.,!?;:"“”()\[\]{}]/g,'')
    .replace(/[\s\-_]+/g,'')
    .trim();
}
function firstAnswer(sent){
  const m = sent.match(/\[\[(.+?)\]\]/);
  return m ? m[1] : '';
}
/* 把带 [[ ]] 的句子转成 HTML
   mode: 'blank'（首字母填空）| 'uline'（划线替换）| 'ans'（显示答案） */
function sentToHtml(sent, mode){
  let out = '', last = 0, m;
  const re = /\[\[(.+?)\]\]/g;
  while((m = re.exec(sent))){
    out += escapeHtml(sent.slice(last, m.index));
    const a = m[1];
    if(mode === 'blank'){
      out += '<span class="blank"><span class="first">'+escapeHtml(a[0])+'</span><span class="line"></span></span>';
    }else if(mode === 'uline'){
      out += '<u class="uline">'+escapeHtml(a)+'</u>';
    }else{
      out += '<span class="ans">'+escapeHtml(a)+'</span>';
    }
    last = m.index + m[0].length;
  }
  out += escapeHtml(sent.slice(last));
  return out;
}

/* =========================================================
   勾选面板初始化
   ========================================================= */
function initChecks(){
  const build = (data, kind, el) => {
    const tags = [...new Set(data.map(d=>d.tag))]
      .sort((a,b)=>TAG_ORDER.indexOf(a)-TAG_ORDER.indexOf(b));
    el.innerHTML = tags.map(t=>{
      const n = data.filter(d=>d.tag===t).length;
      return '<label class="chk"><input type="checkbox" data-kind="'+kind+'" value="'+t+'" checked>'
           + t + '<span class="cnt">'+n+'</span></label>';
    }).join('')
    + '<label class="chk all"><input type="checkbox" data-kind="'+kind+'" value="__all__" checked>全选</label>';
  };
  build(WORDS,'word',document.getElementById('wordChks'));
  build(PHRASES,'phrase',document.getElementById('phraseChks'));

  document.querySelectorAll('input[value="__all__"]').forEach(allBox=>{
    const kind = allBox.dataset.kind;
    const getBoxes = ()=>[...document.querySelectorAll('input[data-kind="'+kind+'"]')]
                          .filter(b=>b.value!=='__all__');
    allBox.addEventListener('change',()=>{
      getBoxes().forEach(b=>b.checked = allBox.checked);
      allBox.indeterminate = false;
    });
    document.addEventListener('change',e=>{
      if(e.target.dataset && e.target.dataset.kind===kind && e.target.value!=='__all__'){
        const bs = getBoxes();
        const checked = bs.filter(b=>b.checked).length;
        allBox.checked = checked === bs.length;
        allBox.indeterminate = checked>0 && checked<bs.length;
      }
    });
  });
}

/* =========================================================
   状态
   ========================================================= */
let currentQs = [];
let currentPhraseBank = [];

/* =========================================================
   生成试题
   ========================================================= */
function generate(){
  const wordTags = [...document.querySelectorAll('input[data-kind="word"]')]
      .filter(i=>i.value!=='__all__' && i.checked).map(i=>i.value);
  const phraseTags = [...document.querySelectorAll('input[data-kind="phrase"]')]
      .filter(i=>i.value!=='__all__' && i.checked).map(i=>i.value);
  const types = [...document.querySelectorAll('input[data-kind="type"]:checked')]
      .map(i=>i.value)
      .sort((a,b)=>TYPE_ORDER.indexOf(a)-TYPE_ORDER.indexOf(b));

  let n = parseInt(document.getElementById('numQ').value,10);
  if(isNaN(n)||n<1) n = 10;
  n = Math.min(n,60);

  if(types.length===0){ alert('请至少选择一种题型！'); return; }
  if(wordTags.length===0 && phraseTags.length===0){ alert('请至少选择一个考察内容！'); return; }

  const selWords   = WORDS.filter(w=>wordTags.includes(w.tag));
  const selPhrases = PHRASES.filter(p=>phraseTags.includes(p.tag));

  /* 按题型建池子，顺序与题型列表一致 */
  const groups = [];
  types.forEach(t=>{
    if(t==='cn'){
      const pool = shuffle(selWords.map(w=>({type:'cn',word:w})));
      if(pool.length) groups.push({type:'cn',pool});
    }
    if(t==='first'){
      const arr = [];
      selWords.forEach(w=>w.ex.forEach(s=>arr.push({type:'first',word:w,sent:s})));
      if(arr.length) groups.push({type:'first',pool:shuffle(arr)});
    }
    if(t==='phrase'){
      const arr = [];
      selPhrases.forEach(p=>p.ex.forEach(e=>arr.push({type:'phrase',phrase:p,sent:e.s,answer:e.a})));
      if(arr.length) groups.push({type:'phrase',pool:shuffle(arr)});
    }
  });

  if(groups.length===0){ alert('当前选择下没有可用题目，请检查勾选内容。'); return; }

  /* 轮流分配题数，尽量均匀 */
  const counts = groups.map(()=>0);
  let remaining = n;
  while(remaining > 0){
    let assigned = false;
    for(let i=0;i<groups.length && remaining>0;i++){
      if(counts[i] < groups[i].pool.length){
        counts[i]++; remaining--; assigned = true;
      }
    }
    if(!assigned) break;
  }

  /* 抽取并预处理，按题型分组顺序排列 */
  const chosen = [];
  groups.forEach((g,i)=>{
    for(let k=0;k<counts[i];k++){
      chosen.push(prep(g.pool[k]));
    }
  });

  currentPhraseBank = selPhrases;
  renderPaper(chosen);
}

/* 预处理：提取答案、生成题干 */
function prep(q){
  if(q.type==='cn'){
    q.answer = q.word.w;
    q.prompt = '写出下列汉语释义对应的英语单词：<b class="cn">'+escapeHtml(q.word.cn)+'</b>';
  }else if(q.type==='first'){
    const ans = firstAnswer(q.sent);
    q.answer = ans;
    q.prompt = sentToHtml(q.sent,'blank');
  }else{
    q.prompt = sentToHtml(q.sent,'uline');
    q.solved = sentToHtml(q.sent,'ans');
  }
  return q;
}

/* =========================================================
   渲染试卷
   ========================================================= */
function renderPaper(qs){
  currentQs = qs;

  /* 短语词单 */
  const bank = document.getElementById('phraseBank');
  const hasPhraseQ = qs.some(q=>q.type==='phrase');
  if(hasPhraseQ && currentPhraseBank.length){
    bank.classList.remove('hidden');
    bank.innerHTML = '<div class="bank-title">📎 短语词单（第 3 类题请从下列短语中选用，注意时态、语态和词形变化）</div>'
      + '<div class="chips">' + currentPhraseBank.map(p=>'<span class="chip">'+escapeHtml(p.p)+'</span>').join('') + '</div>';
  }else{
    bank.classList.add('hidden');
  }

  /* 按题型分组 */
  const groups = [];
  qs.forEach(q=>{
    let g = groups.find(x=>x.type===q.type);
    if(!g){ g = {type:q.type, items:[]}; groups.push(g); }
    g.items.push(q);
  });
  groups.sort((a,b)=>TYPE_ORDER.indexOf(a.type)-TYPE_ORDER.indexOf(b.type));

  const NUM_CN = ['一','二','三','四'];
  let html = '';
  let globalIdx = 0;

  groups.forEach((g, gi)=>{
    html += '<div class="group-title">'+NUM_CN[gi]+'、'+TYPE_NAME[g.type]
          + '（共 '+g.items.length+' 题）</div>';
    g.items.forEach(q=>{
      const i = globalIdx++;
      let hint = '';
      if(q.type==='phrase'){
        hint = ''; // 按用户要求：不提供中文提示
      }
      const cls = q.type==='cn' ? 'qtext' : 'qtext en';
      const ph  = q.type==='cn' ? '输入英语单词'
                : q.type==='first' ? '补全单词（注意词形变化）'
                : '填入合适的短语（注意时态、语态、人称变化）';

      html += '<div class="q" data-i="'+i+'">'
        + '<div class="qhead"><span class="qno">第 '+(i+1)+' 题</span>'+BADGE[q.type]+'</div>'
        + '<div class="'+cls+'">'+q.prompt+'</div>'
        + hint
        + '<input type="text" class="ansinput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="'+ph+'">'
        + '<div class="fb hidden"></div>'
        + '</div>';
    });
  });

  document.getElementById('questions').innerHTML = html;
  document.getElementById('paperTitle').textContent = '试题（共 ' + qs.length + ' 题）';
  document.getElementById('paperCard').classList.remove('hidden');
  const rc = document.getElementById('resultCard');
  rc.classList.add('hidden');
  rc.innerHTML = '';

  const btn = document.getElementById('submitBtn');
  btn.disabled = false;
  btn.textContent = '交卷';
  btn.onclick = submitPaper;

  document.getElementById('paperCard').scrollIntoView({behavior:'smooth',block:'start'});
}

/* =========================================================
   交卷判分
   ========================================================= */
function submitPaper(){
  const inputs = document.querySelectorAll('#questions .ansinput');
  let correct = 0;
  const wrongs = [];

  currentQs.forEach((q,i)=>{
    const el = inputs[i];
    if(!el) return;
    const user = el.value.trim();
    const ok = norm(user) === norm(q.answer);

    el.disabled = true;
    const qDiv = el.closest('.q');
    const fb = qDiv.querySelector('.fb');
    fb.classList.remove('hidden');

    if(ok){
      correct++;
      qDiv.classList.add('ok');
      fb.classList.add('ok');
      fb.innerHTML = '✅ 正确';
    }else{
      qDiv.classList.add('bad');
      fb.classList.add('bad');
      fb.innerHTML = '❌ 你的答案：<b>' + (escapeHtml(user) || '（空）') + '</b>　|　正确答案：<b class="ans">'
                   + escapeHtml(q.answer) + '</b>';
      wrongs.push({q, user});
    }
  });

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '已交卷';

  renderResult(correct, currentQs.length, wrongs);
}

/* =========================================================
   渲染结果
   ========================================================= */
function renderResult(correct, total, wrongs){
  const score = Math.round(correct / total * 100);
  const card = document.getElementById('resultCard');

  let html = '';
  html += '<div class="score">' + score + ' 分</div>';
  html += '<div class="sub">共 ' + total + ' 题，答对 ' + correct + ' 题，答错 ' + (total-correct) + ' 题</div>';
  html += '<div class="bar"><i style="width:' + score + '%"></i></div>';

  if(wrongs.length === 0){
    html += '<div class="perfect">🎉 全部正确，太棒了！</div>';
  }else{
    html += '<div class="wtitle">📕 错题集（' + wrongs.length + ' 题）</div>';
    html += wrongs.map((it, idx)=>{
      const q = it.q;
      let stem;
      if(q.type === 'cn'){
        stem = '<span class="badge b1">中译英</span> ' + escapeHtml(q.word.cn);
      }else if(q.type === 'first'){
        stem = '<span class="badge b2">首字母填空</span> ' + q.solved;
      }else{
        stem = '<span class="badge b3">短语替换</span> ' + q.solved;
      }
      return '<div class="witem">'
        + '<div class="wq">' + (idx+1) + '. ' + stem + '</div>'
        + '<div class="wa">你的答案：<b>' + (escapeHtml(it.user) || '（空）')
        + '</b>　→　正确答案：<b>' + escapeHtml(q.answer) + '</b></div>'
        + '</div>';
    }).join('');
  }

  html += '<div style="text-align:center;margin-top:22px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">'
        + '<button class="btn primary" onclick="window.scrollTo({top:0,behavior:\'smooth\'})">重新配置</button>'
        + '<button class="btn" id="againBtn">再来一套</button>'
        + '</div>';

  card.innerHTML = html;
  card.classList.remove('hidden');
  card.scrollIntoView({behavior:'smooth',block:'start'});

  document.getElementById('againBtn').onclick = ()=>{ generate(); };
}

/* =========================================================
   启动
   ========================================================= */
initChecks();
document.getElementById('genBtn').addEventListener('click', generate);
</script>
